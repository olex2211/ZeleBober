services:
  db:
    restart: always

  backend:
    build:
      target: prod
    restart: always
    environment:
      DEBUG: 0
      DB_ENGINE: postgres
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    build:
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/}
        VITE_WS_URL: ${VITE_WS_URL:-/ws/}
    restart: "no"
    volumes:
      - react_build:/dist

  nginx:
    image: nginx:1.29.4-alpine
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - react_build:/usr/share/nginx/html
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend

volumes:
  static_volume:
  media_volume:
  react_build: