worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       C:/Users/Roman/Desktop/nginx-1.29.1/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Налаштування для WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost;

        # Проксі на React
        location / {
            root   C:\Users\Roman\Desktop\ZeleBober\frontend\client\dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Проксі на Django Api
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Проксі на Django WS
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Проксі на Django Admin
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # 5. Статика Django (для адмінки)
        location /static/ {
            alias C:/Users/Roman/Desktop/ZeleBober/backend/server/staticfiles/;
        }

        # 6. Медіа файли (завантажені користувачами)
        location /media/ {
            alias C:/Users/Roman/Desktop/ZeleBober/backend/server/media/;
        }
    }
}

